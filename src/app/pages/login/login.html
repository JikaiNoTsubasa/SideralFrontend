<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="brand">Sideral</h1>
    <p class="muted">Connectez-vous à votre espace</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <div class="form-field">
      <label for="login">Identifiant ou email</label>
      <input id="login" type="text" formControlName="login" autocomplete="username" autofocus />
    </div>

    <div class="form-field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    <button type="submit" class="btn btn-primary submit" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</div>
