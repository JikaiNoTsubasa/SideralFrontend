      <input type="search" formControlName="q" placeholder="Rechercher…" aria-label="Rechercher dans les documents" />
    </form>
    <a routerLink="/documents" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">📁</span> Tous les documents
    </a>
    <a routerLink="/documents/search" routerLinkActive="active"><span aria-hidden="true">🔎</span> Recherche</a>
    <a routerLink="/documents/checked-out" routerLinkActive="active"><span aria-hidden="true">✏️</span> Mes extractions</a>
    <a routerLink="/documents/trash" routerLinkActive="active"><span aria-hidden="true">🗑️</span> Corbeille</a>
  </nav>

  <section>
    <router-outlet />
  </section>
</div>
